<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ROUNZ — 장바구니</title>

    <meta
      name="description"
      content="ROUNZ 장바구니에서 선택한 상품을 확인하고 주문을 진행하세요."
    >

    <link rel="icon" href="/favicon.ico" sizes="any">

    <script type="module" src="./src/js/pages/cart.js"></script>
  </head>

  <body>
    <header class="site__header"></header>

    <main id="content">
      <!-- ========================================
        CART HEADER
      ========================================= -->
      <section
        class="
          site-container
          pb-12
          pt-16
          md:pb-14
          md:pt-20
        "
      >
        <p
          class="
            m-0
            text-xs
            font-semibold
            uppercase
            tracking-[0.16em]
            text-muted
          "
        >
          SHOPPING BAG
        </p>

        <div
          class="
            mt-3
            flex
            flex-col
            gap-4
            sm:flex-row
            sm:items-end
            sm:justify-between
          "
        >
          <div>
            <h1
              class="
                m-0
                text-[clamp(2.8rem,5.5vw,5rem)]
                font-medium
                leading-none
                tracking-[-0.055em]
              "
            >
              장바구니
            </h1>

            <p
              class="
                mb-0
                mt-4
                text-sm
                text-muted
              "
            >
              총
              <strong
                class="
                  cart__count-value
                  font-semibold
                  text-ink
                "
              >
                0
              </strong>
              개의 상품이 담겨 있습니다.
            </p>
          </div>
        </div>
      </section>

      <!-- ========================================
        CART BODY
      ========================================= -->
      <section
        class="
          site-container
          pb-20
          lg:pb-28
        "
      >
        <div
          class="
            grid
            gap-10
            lg:grid-cols-[minmax(0,1fr)_340px]
            xl:gap-14
          "
        >
          <!-- 왼쪽: 전체선택 + 상품 목록 -->
          <div class="min-w-0">
            <!-- 전체 선택 -->
            <div
              class="
                flex
                min-h-14
                items-center
                justify-between
                gap-5
                border-y
                border-line
              "
            >
              <div
                class="
                  flex
                  items-center
                  gap-3
                "
              >
                <input
                  id="select-all"
                  type="checkbox"
                  class="
                    cart__select-all-checkbox
                    sr-only
                  "
                >

                <label
                  for="select-all"
                  class="
                    cart__select-all-label
                    flex
                    cursor-pointer
                    items-center
                    gap-2
                    text-sm
                    font-medium
                  "
                >
                  <span
                    class="
                      cart__checkbox-box
                      flex
                      size-5
                      items-center
                      justify-center
                      border
                      border-line
                    "
                    aria-hidden="true"
                  >
                    <svg
                      class="
                        cart__checkbox-check
                        hidden
                      "
                      width="14"
                      height="14"
                      viewBox="0 0 24 24"
                      fill="none"
                      aria-hidden="true"
                    >
                      <path
                        d="M5 12L9 16L19 6"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      ></path>
                    </svg>
                  </span>
                  전체 선택
                </label>
              </div>

              <button
                type="button"
                class="
                  cart__delete-btn
                  cursor-pointer
                  border-0
                  bg-transparent
                  p-0
                  text-xs
                  font-medium
                  text-muted
                  transition-colors
                  hover:text-plum-700
                "
              >
                선택 삭제
              </button>
            </div>

            <!-- 상품 목록 -->
            <section aria-labelledby="cart-list-title" class="min-w-0">
              <h2 id="cart-list-title" class="sr-only">장바구니 상품</h2>

              <ul
                class="
                  cart__list
                  m-0
                  list-none
                  p-0
                "
              ></ul>
            </section>
          </div>

          <!-- 오른쪽: 주문 요약 -->
          <aside
            class="
              cart-summary
              h-fit
              border
              border-line
              bg-paper
              p-6
              lg:sticky
              lg:top-[7rem]
              lg:p-7
            "
          >
            <h2
              class="
                m-0
                text-lg
                font-semibold
              "
            >
              주문 요약
            </h2>

            <dl
              class="
                mt-7
                space-y-4
                text-sm
              "
            >
              <div
                class="
                  flex
                  items-center
                  justify-between
                  gap-4
                "
              >
                <dt class="text-muted">선택 상품</dt>

                <dd
                  class="
                    cart-summary__selected-count
                    m-0
                    font-medium
                  "
                >
                  0개
                </dd>
              </div>

              <div
                class="
                  flex
                  items-center
                  justify-between
                  gap-4
                "
              >
                <dt class="text-muted">상품 금액</dt>

                <dd
                  class="
                    cart-summary__product-total
                    m-0
                    font-medium
                  "
                >
                  0원
                </dd>
              </div>

              <div
                class="
                  flex
                  items-center
                  justify-between
                  gap-4
                "
              >
                <dt class="text-muted">배송비</dt>

                <dd
                  class="
                    cart-summary__shipping
                    m-0
                    font-medium
                  "
                >
                  0원
                </dd>
              </div>
            </dl>

            <div
              class="
                mt-6
                flex
                items-end
                justify-between
                gap-4
                border-t
                border-line
                pt-6
              "
            >
              <span
                class="
                  text-sm
                  font-semibold
                "
              >
                총 결제금액
              </span>

              <strong
                class="
                  cart-summary__final-total
                  text-2xl
                  font-semibold
                  tracking-[-0.04em]
                "
              >
                0원
              </strong>
            </div>

            <button
              type="button"
              class="
                cart-summary__purchase-btn
                mt-7
                min-h-14
                w-full
                cursor-pointer
                border
                border-ink
                bg-ink
                px-5
                text-sm
                font-semibold
                text-white
                transition-colors
                hover:border-plum-700
                hover:bg-plum-700
                disabled:cursor-not-allowed
                disabled:border-line
                disabled:bg-line
                disabled:text-muted
              "
              disabled
            >
              선택 상품 주문하기
            </button>

            <p
              class="
                mb-0
                mt-4
                text-xs
                leading-5
                text-muted
              "
            >
              배송비는 무료이며, 렌즈 가공 상품은 추가 제작 기간이 발생할 수
              있습니다.
            </p>
          </aside>
        </div>
      </section>

      <!-- ========================================
        RECOMMEND
      ========================================= -->
      <section
        class="
          border-t
          border-line
          bg-paper
          py-16
          lg:py-20
        "
        aria-labelledby="recommend-title"
      >
        <div class="site-container">
          <div
            class="
              flex
              items-end
              justify-between
              gap-6
            "
          >
            <div>
              <p
                class="
                  m-0
                  text-xs
                  font-semibold
                  uppercase
                  tracking-[0.16em]
                  text-muted
                "
              >
                MORE TO SEE
              </p>

              <h2
                id="recommend-title"
                class="
                  mb-0
                  mt-3
                  text-3xl
                  font-medium
                  tracking-[-0.04em]
                "
              >
                이런 상품은 어떠세요?
              </h2>
            </div>

            <a
              href="/productList.html"
              class="
                hidden
                text-sm
                font-medium
                text-ink
                underline
                decoration-line
                underline-offset-6
                transition-colors
                hover:text-plum-700
                sm:inline-flex
              "
            >
              전체 상품 보기
            </a>
          </div>

          <ul
            class="
              recommend__list
              mt-9
              grid
              list-none
              grid-cols-2
              gap-x-4
              gap-y-10
              p-0
              md:grid-cols-4
              lg:gap-x-5
            "
          ></ul>
        </div>
      </section>
    </main>

    <footer class="site__footer"></footer>
  </body>
</html>
