<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ROUNZ — 로그인</title>

    <meta name="description" content="ROUNZ 계정으로 로그인하세요.">

    <link rel="icon" href="/favicon.ico" sizes="any">

    <script type="module" src="./src/js/pages/login.js"></script>
  </head>

  <body data-page="login">
    <header class="site__header"></header>

    <main
      id="content"
      class="
        flex
        min-h-[calc(100vh-5rem)]
        items-start
        justify-center
        px-5
        pb-20
        pt-20
        md:pb-24
        md:pt-24
        lg:pt-28
      "
    >
      <section
        class="
          w-full
          max-w-[30rem]
        "
        aria-labelledby="login-heading"
      >
        <!-- INTRO -->
        <div class="text-center">
          <p
            class="
              m-0
              text-xs
              font-semibold
              uppercase
              tracking-[0.18em]
              text-muted
            "
          >
            WELCOME BACK
          </p>

          <h1
            id="login-heading"
            class="
              mb-0
              mt-4
              text-[clamp(2.5rem,6vw,4rem)]
              font-medium
              leading-none
              tracking-[-0.055em]
            "
          >
            로그인
          </h1>

          <p
            class="
              mb-0
              mt-5
              text-sm
              leading-7
              text-muted
            "
          >
            ROUNZ 계정으로 로그인하고 저장한 상품과 장바구니를 이어서
            확인해보세요.
          </p>
        </div>

        <!-- FORM -->
        <form
          class="
            login-form
            mt-10
          "
          novalidate
        >
          <!-- EMAIL -->
          <div class="auth__field">
            <label
              for="email"
              class="
                block
                text-xs
                font-semibold
                uppercase
                tracking-[0.1em]
                text-ink
              "
            >
              이메일
            </label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="example@email.com"
              autocomplete="email"
              required
              class="
                mt-2
                h-13
                w-full
                border
                border-line
                bg-paper
                px-4
                text-sm
                text-ink
                outline-none
                transition-colors
                placeholder:text-muted
                hover:border-plum-300
                focus:border-plum-700
              "
            >
          </div>

          <!-- PASSWORD -->
          <div class="auth__field mt-6">
            <div
              class="
                flex
                items-center
                justify-between
                gap-4
              "
            >
              <label
                for="password"
                class="
                  text-xs
                  font-semibold
                  uppercase
                  tracking-[0.1em]
                  text-ink
                "
              >
                비밀번호
              </label>

              <button
                type="button"
                class="
                  password-toggle
                  cursor-pointer
                  border-0
                  bg-transparent
                  p-0
                  text-xs
                  text-muted
                  transition-colors
                  hover:text-plum-700
                "
                aria-controls="password"
                aria-pressed="false"
              >
                비밀번호 보기
              </button>
            </div>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="비밀번호를 입력하세요"
              autocomplete="current-password"
              required
              class="
                mt-2
                h-13
                w-full
                border
                border-line
                bg-paper
                px-4
                text-sm
                text-ink
                outline-none
                transition-colors
                placeholder:text-muted
                hover:border-plum-300
                focus:border-plum-700              
              "
            >
          </div>

          <button
            type="submit"
            class="
              login-btn
              mt-8
              min-h-14
              w-full
              cursor-pointer
              border
              border-ink
              bg-ink
              px-5
              text-sm
              font-semibold
              text-white
              transition-colors
              hover:border-plum-700
              hover:bg-plum-700
            "
          >
            로그인
          </button>
        </form>

        <!-- SIGNUP LINK -->
        <p
          class="
            mb-0
            mt-6
            text-center
            text-sm
            text-muted
          "
        >
          아직 계정이 없으신가요?

          <a
            href="/signup.html"
            class="
              ml-1
              font-semibold
              text-ink
              underline
              decoration-line
              underline-offset-4
              transition-colors
              hover:text-plum-700
            "
          >
            회원가입
          </a>
        </p>

        <!-- DIVIDER -->
        <div
          class="
            my-8
            flex
            items-center
            gap-4
          "
          aria-hidden="true"
        >
          <span
            class="
              h-px
              flex-1
              bg-line
            "
          ></span>

          <span
            class="
              text-[0.65rem]
              font-medium
              uppercase
              tracking-[0.12em]
              text-muted
            "
          >
            OR
          </span>

          <span
            class="
              h-px
              flex-1
              bg-line
            "
          ></span>
        </div>

        <!-- SOCIAL -->
        <div class="space-y-3">
          <button
            type="button"
            class="
              auth__social
              auth__social--naver
              flex
              min-h-13
              w-full
              cursor-pointer
              items-center
              justify-center
              gap-3
              border-0
              px-5
              text-sm
              font-semibold
              transition-opacity
              hover:opacity-90
            "
          >
            <img
              src="./src/assets/brand/logo_naver.svg"
              alt=""
              width="18"
              height="18"
            >
            네이버로 로그인
          </button>

          <button
            type="button"
            class="
              auth__social
              auth__social--kakao
              flex
              min-h-13
              w-full
              cursor-pointer
              items-center
              justify-center
              gap-3
              border-0
              px-5
              text-sm
              font-semibold
              transition-opacity
              hover:opacity-90
            "
          >
            <img
              src="./src/assets/brand/logo_kakao.svg"
              alt=""
              width="22"
              height="20"
            >
            카카오로 로그인
          </button>
        </div>

        <!-- NOTICE -->
        <p
          class="
            mb-0
            mt-8
            text-center
            text-xs
            leading-6
            text-muted
          "
        >
          로그인하면 ROUNZ의 이용약관 및 개인정보 처리방침에 동의한 것으로
          간주됩니다.
        </p>
      </section>
    </main>

    <footer class="site__footer"></footer>
  </body>
</html>
